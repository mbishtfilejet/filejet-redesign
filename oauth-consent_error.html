<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Jet : Connect Claude</title>
    <!-- Styles -->
    <link rel="stylesheet" href="src/scss/filejet-style.css">
    <script src="dist/js/jquery.min.js"></script>
    <!-- Scripts -->
</head>

<body>
    <div class="login-page oauth-consent position-relative min-vh-100 d-flex align-items-center justify-content-center px-3 py-5">
        <div class="card position-relative w-100 consent-card">
            <div class="card-body p-4 p-md-5">

                <!-- Apps being connected Start -->
                <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
                    <span class="consent-app-logo border rounded-4">
                        <span class="icon icon-filejetSymbol icon-lg m-0"></span>
                    </span>
                    <span class="consent-dots">......</span>
                    <span class="mn-1 consent-app-logo consent-client-logo rounded-4">C</span>
                </div>
                <!-- Apps being connected End -->

                <!-- No Access State Start -->
                <div class="consent-denied">
                    <div class="mb-4">
                        <h3 class="fw-bold mb-2">Claude can't connect to your account</h3>
                        <span class="consent-meta">Requested by <strong class="text-dark">claude.ai</strong></span>
                    </div>

                    <div class="consent-user d-flex align-items-center gap-3 p-3 rounded-2 mb-4">
                        <span class="consent-avatar rounded-circle flex-shrink-0">ES</span>
                        <div class="flex-grow-1 text-break">
                            <p class="fw-bold text-dark mb-0">Emmanuel Sims</p>
                            <p class="consent-meta mb-0">emmanuel.sims@acmeholdings.com &middot; Acme Holdings LLC</p>
                        </div>
                    </div>

                    <div class="alert alert-danger fw-normal py-3 mb-4 border-0" role="alert">
                        <div class="d-flex align-items-start gap-2">
                            <span class="icon icon-alert-red icon-sm flex-shrink-0 m-0 mt-1"></span>
                            <small>Your account doesn't have AI agent access. Ask your FileJet admin.</small>
                        </div>
                    </div>

                    <div class="text-center">
                        <a href="#" class="text-indigo fw-bold text-decoration-none">Back to Claude</a>
                    </div>
                </div>
                <!-- No Access State End -->

            </div>
        </div>
    </div>

    <script src="dist/js/plugins.min.js"></script>
    <script src="dist/js/custom.min.js"></script>
</body>

</html>
