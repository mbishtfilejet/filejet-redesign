<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Report Summary</title>
</head>
<style>
    .odd {
        background-color: #FAFAFA;
    }

    @media screen and (max-width:480px) {
        .two-col {
            display: block !important;
            width: 100% !important;
            /* full width on mobile */
            min-height: 130px !important;
            /* equal height for all boxes */
            box-sizing: border-box;
            /* include padding & border in width */
            margin-bottom: 10px;
            /* spacing between stacked boxes */
        }

        .spacer {
            display: none !important;
            /* remove horizontal spacing on stacked layout */
        }
    }
</style>

<body style="margin:0; padding:0; font-family: Arial, sans-serif; background-color:#f4f4f4;">

    <!-- Container -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0"
        style="max-width:700px; margin:auto;  margin-top: 30px; background:#ffffff; border-collapse:collapse;">
        <tr>
            <td style="padding:20px;" >

                <!-- Header -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <tbody>
                        <tr>
                            <td>
                                <img src="../dist/images/email-images/externalHolder.png" alt="Filejet Logo"
                                    style="height:50px;">
                            </td>
                            <td align="right" style="font-size:12px; line-height: 26px;">
                                <div style="font-weight:700; color: #6C6C6C;">PREPARED FOR</div>
                                <div style="font-weight:700; color: #3E484A; font-size:16px;">John Smith</div>
                                <div style="font-weight:700; color: #6C6C6C;">ON AUGUST 30, 2025</div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                    style="margin-bottom: 20px">
                    <tr>
                        <td style="border-top:1px solid #D8DDDF; line-height:1px; font-size:0;">&nbsp;</td>
                    </tr>
                </table>

                <div
                    style="font-size:12px; line-height:16px; word-break:break-word; margin-bottom: 10px; text-transform: uppercase;">
                    <strong style="font-size:14px;">INNOVATIVE VENTURES LLC - CONTINUED</strong><br>
                </div>
                <div style="font-size:12px; color: #777777; word-break:break-word; margin-bottom: 10px;">
                    <strong>Ownership</strong>
                </div>
                <table width="100%" cellspacing="0" cellpadding="15"
                    style="border:1px solid #D8DDDF; border-radius: 10px; overflow: hidden; font-size:12px;margin-bottom: 30px;">
                    <tr class="even" style="font-weight:bold; line-height: 20px;">
                        <td style="border-bottom:2px solid #CED2D9; padding: 10px;">Owner Name</td>
                        <td style="border-bottom:2px solid #CED2D9; padding: 10px;">Percentage</td>
                        <td style="border-bottom:2px solid #CED2D9; padding: 10px;">Start Date</td>
                        <td style="border-bottom:2px solid #CED2D9; padding: 10px;">End Date</td>
                    </tr>
                    <tr class="odd">
                        <td style="border-bottom:1px solid #CED2D9; padding: 10px;">CA</td>
                        <td style="border-bottom:1px solid #CED2D9; padding: 10px;">60%</td>
                        <td style="border-bottom:1px solid #CED2D9; padding: 10px;">09/15/2025</td>
                        <td style="border-bottom:1px solid #CED2D9; padding: 10px;">-</td>
                    </tr>
                    <tr class="even">
                        <td style="padding: 10px;">DE</td>
                        <td style="padding: 10px;">40%</td>
                        <td style="padding: 10px;">10/28/2025</td>
                        <td style="padding: 10px;">-</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- Footer -->


    <table width="100%" cellpadding="20" cellspacing="0" border="0"
        style="background-color:#ffffff; border-collapse:collapse; max-width:700px; margin:auto; margin-bottom: 30px;">
        <tbody>
            <tr>
                <td style="padding: 20px;">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                        style="margin-bottom: 10px;">
                        <tr>
                            <td style="border-top:2px solid #FF551A; line-height:1px; font-size:0;"></td>
                        </tr>
                    </table>
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                        <tr>
                            <td class="page_footer_content"
                                style="width: 25%;vertical-align: middle;text-align: left; font-size: 12px;">

                                Website: <a href="https://www.filejet.com">filejet.com</a>

                            </td>
                            <td class="page_footer_content"
                                style="width: 50%; text-align: left; vertical-align: middle;">
                            </td>
                            <td style="width: 25%;vertical-align: middle;text-align: right; font-size: 12px;">
                                Phone: +1(949)259-5955
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>




</body>

</html>
